<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Headphones</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
    #ar-container { width: 100vw; height: 100dvh; }
    #start-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0,0,0,0.75); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: sans-serif; text-align: center; padding: 24px; box-sizing: border-box;
    }
    #start-overlay button {
      margin-top: 16px; padding: 14px 28px; font-size: 18px; border-radius: 30px;
      border: none; background: #fff; color: #000; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="start-overlay">
    <p>Point your camera at the coin to see the headphones appear</p>
    <button id="start-btn">Start AR</button>
  </div>
  <div id="ar-container"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
    import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

    const mindarThree = new MindARThree({
      container: document.querySelector("#ar-container"),
      imageTargetSrc: "./targets.mind",
    });
    const { renderer, scene, camera } = mindarThree;

    // Lighting - without this the model will look flat/black
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(0.5, 1, 0.5);
    scene.add(dirLight);

    const anchor = mindarThree.addAnchor(0);

    new GLTFLoader().load(
      "./headphones.glb",
      (gltf) => {
        const model = gltf.scene;

        // The target image plane is 1 unit tall (MindAR convention), origin at its center.
        // The coin sits almost exactly in the middle of the photo, so a small offset here
        // nudges the model to sit right above it instead of dead-center of the whole photo.
        model.position.set(0, 0.02, 0.05);

        // Start small - MindAR units are tied to the physical size of your printed target image,
        // so this almost always needs manual tuning. Adjust and re-test on your phone.
        model.scale.set(0.15, 0.15, 0.15);

        anchor.group.add(model);
      },
      undefined,
      (err) => console.error("Failed to load model", err)
    );

    document.querySelector("#start-btn").addEventListener("click", async () => {
      document.querySelector("#start-overlay").style.display = "none";
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
