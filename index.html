<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Ramen</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
    #ar-container { width: 100vw; height: 100dvh; }
    #start-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0,0,0,0.85); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: sans-serif; text-align: center; padding: 24px; box-sizing: border-box;
    }
    #start-overlay button {
      margin-top: 16px; padding: 14px 28px; font-size: 18px; border-radius: 30px;
      border: none; background: #fff; color: #000; font-weight: bold;
    }
    #status {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace; font-size: 12px;
      padding: 8px; max-height: 40vh; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    #status.error { color: #ff5555; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="start-overlay">
    <p>Point your camera at the "PROGRAMFÜZET" booklet cover</p>
    <button id="start-btn">Start AR</button>
  </div>
  <div id="ar-container"></div>
  <div id="status"></div>

  <script>
    // Visible on-screen logger so we can see what's happening/failing without USB debugging.
    const statusEl = document.getElementById('status');
    function log(msg, isError) {
      console.log(msg);
      const line = document.createElement('div');
      line.textContent = (isError ? '[ERROR] ' : '[ok] ') + msg;
      if (isError) statusEl.classList.add('error');
      statusEl.appendChild(line);
    }
    window.addEventListener('error', (e) => log('window error: ' + e.message, true));
    window.addEventListener('unhandledrejection', (e) => log('unhandled rejection: ' + (e.reason && e.reason.message || e.reason), true));
    log('page loaded, waiting for tap...');
  </script>

  <script type="module">
    const statusEl = document.getElementById('status');
    function log(msg, isError) {
      console.log(msg);
      const line = document.createElement('div');
      line.textContent = (isError ? '[ERROR] ' : '[ok] ') + msg;
      if (isError) statusEl.classList.add('error');
      statusEl.appendChild(line);
    }

    document.querySelector("#start-btn").addEventListener("click", async () => {
      try {
        document.querySelector("#start-overlay").style.display = "none";
        log('loading three.js + MindAR from CDN...');

        const THREE = await import("three");
        log('three.js loaded');
        const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
        const { DRACOLoader } = await import("three/addons/loaders/DRACOLoader.js");
        log('GLTFLoader loaded');

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/");
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);
        const { MindARThree } = await import("https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js");
        log('MindAR loaded');

        const mindarThree = new MindARThree({
          container: document.querySelector("#ar-container"),
          imageTargetSrc: "./targets.mind",
        });
        const { renderer, scene, camera } = mindarThree;
        log('MindARThree instance created');

        renderer.outputColorSpace = THREE.SRGBColorSpace;

        // Current three.js versions use physically-correct light units, where intensities
        // that used to look bright (1, 1.2) now render almost pure black - it's not a
        // missing-texture problem, just severely underlit. These values were tuned by
        // actually rendering the model and checking pixel brightness, not guessed.
        scene.add(new THREE.AmbientLight(0xffffff, 3));
        scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 5);
        dirLight.position.set(0.5, 1, 0.5);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xffffff, 3);
        fillLight.position.set(-0.5, 0.5, -0.5);
        scene.add(fillLight);

        const anchor = mindarThree.addAnchor(0);

        gltfLoader.load(
          "./ramen.glb",
          (gltf) => {
            log('ramen.glb loaded successfully');
            const model = gltf.scene;
            // Centered on the target image (the booklet's blank diamond area), floating slightly
            // above the surface. Scale/position are starting guesses - tune on-device.
            model.position.set(0, 0, 0.05);
            model.scale.set(0.35, 0.35, 0.35);
            anchor.group.add(model);
          },
          undefined,
          (err) => log('FAILED to load ramen.glb: ' + err.message, true)
        );

        log('requesting camera access...');
        await mindarThree.start();
        log('camera started, AR session running');
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });
      } catch (err) {
        log('FATAL: ' + err.message, true);
        console.error(err);
      }
    });
  </script>
</body>
</html>
